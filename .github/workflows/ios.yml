name: iOS

# Build and verify the iOS port on a real macOS runner.
#
# Why this exists: the development machine is Linux, which cannot compile or
# run anything that imports CoreBluetooth, UIKit, WebKit or Security. GitHub's
# macOS runners can. That makes CI the verification environment for every layer
# the Linux box cannot reach, rather than a convenience extra.
#
# Two jobs, deliberately separate:
#   core-tests — the portable BFGCore package, also verifiable on Linux
#   build-ios  — the app target, only compilable on macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 出包优先：core-tests 暂时停用（单测在本地/需要时手动开）。
  # 恢复时：去掉下面的注释，并在 build-ios 下加回 `needs: core-tests`。
  # core-tests:
  #   name: Core tests (portable)
  #   runs-on: macos-14
  #   steps:
  #     - uses: actions/checkout@v4
  # 
  #     - name: Show toolchain
  #       run: swift --version
  # 
  #     # Same suite that passes on Linux, re-run here to catch any
  #     # platform-specific divergence in Foundation or XCTest.
  #     - name: Run BFGCore tests
  #       run: swift test
  # 
  #     # Drives the real client state machine against the simulated vehicle:
  #     # pairing, the full read chain, and write-then-read-back including the
  #     # degraded cases (lost ACK, lazily persisted value, silent registers).
  #     - name: Run simulated-vehicle end-to-end demo
  #       run: swift run bfgdemo
  # 
  build-ios:
    name: Build iOS app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # XcodeGen emits a project in a recent object format, which an older
      # default Xcode refuses to open ("future Xcode project file format").
      # Picking the newest installed Xcode avoids pinning the repository to
      # whatever the runner happens to default to.
      - name: Select newest available Xcode
        run: |
          set -euo pipefail
          echo "Installed Xcode versions:"
          ls -d /Applications/Xcode*.app
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml

      # XcodeGen's `info:` key regenerates the plist at the given path and drops
      # any key not restated under `info.properties`. That silently removed
      # UILaunchScreen (iOS then renders the app letterboxed, i.e. not full
      # screen) and NSBluetoothAlwaysUsageDescription (iOS terminates the app on
      # first CoreBluetooth call without it). Assert the keys survive so this
      # cannot regress unnoticed.
      - name: Assert Info.plist keys survived generation
        run: |
          set -euo pipefail
          PLIST=ios/BFGCalibration/Info.plist
          for key in UILaunchScreen NSBluetoothAlwaysUsageDescription UIBackgroundModes; do
            if /usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" >/dev/null 2>&1; then
              echo "ok   $key"
            else
              echo "::error::$key is missing from $PLIST"
              exit 1
            fi
          done

      # Unsigned build. This is the artefact to hand to a local signing tool
      # when no signing secrets are configured.
      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project ios/BFGCalibration.xcodeproj \
            -scheme BFGCalibration \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # Assert against the built artefact, not just the source file: this is
      # what actually ships.
      - name: Assert built app Info.plist
        run: |
          set -euo pipefail
          PLIST=build/Build/Products/Release-iphoneos/BFGCalibration.app/Info.plist
          for key in UILaunchScreen NSBluetoothAlwaysUsageDescription; do
            if /usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" >/dev/null 2>&1; then
              echo "ok   $key"
            else
              echo "::error::$key missing from the built app"
              exit 1
            fi
          done

      - name: Package unsigned app
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/BFGCalibration.app out/Payload/
          cd out && zip -qry BFGCalibration-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: BFGCalibration-unsigned-ipa
          path: out/BFGCalibration-unsigned.ipa

      # Optional signed build.
      #
      # Skipped unless the repository defines the signing secrets below, so a
      # fork or a clone without credentials still produces the unsigned IPA.
      # See docs/IOS_SIGNING.md for how to produce each value.
      #   BUILD_CERTIFICATE_BASE64      — .p12, base64-encoded
      #   P12_PASSWORD                  — password for that .p12
      #   BUILD_PROVISION_PROFILE_BASE64— .mobileprovision, base64-encoded
      #   KEYCHAIN_PASSWORD             — any temporary password
      #   APPLE_TEAM_ID                 — 10-character team identifier
      - name: Import signing identity
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          HAS_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}" | base64 --decode -o $PROFILE_PATH

          security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "${{ secrets.P12_PASSWORD }}" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: \
            -k "${{ secrets.KEYCHAIN_PASSWORD }}" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive and export (signed)
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          HAS_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
        run: |
          xcodebuild \
            -project ios/BFGCalibration.xcodeproj \
            -scheme BFGCalibration \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -archivePath build/BFGCalibration.xcarchive \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            archive

          cat > /tmp/export.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>compileBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/BFGCalibration.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist /tmp/export.plist

      - uses: actions/upload-artifact@v4
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          HAS_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
        with:
          name: BFGCalibration-signed-ipa
          path: build/export/*.ipa
