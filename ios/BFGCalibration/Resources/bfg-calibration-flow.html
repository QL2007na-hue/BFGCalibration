<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"></head><body>
<div id="bfg-ui-prototype">
  <div class="nb-stage">
    <div class="nb-preview-nav" aria-label="快速查看页面">
      <button type="button" data-preview="home">首页</button>
      <button type="button" data-preview="review">信息核对</button>
      <button type="button" data-preview="write">参数写入</button>
      <button type="button" data-preview="success">成功状态</button>
      <button type="button" data-preview="failure">失败状态</button>
    </div>

    <section class="nb-phone" aria-label="BFG 电量校准新版手机界面原型">
      <div class="nb-statusbar" aria-hidden="true">
        <span>9:41</span>
        <span class="nb-status-icons"><i data-lucide="signal"></i><i data-lucide="wifi"></i><i data-lucide="battery-full"></i></span>
      </div>
      <div id="nb-screen" class="nb-screen" aria-live="polite"></div>
    </section>
  </div>
</div>

<style>
  #bfg-ui-prototype {
    --nb-accent: #2f9e7f;
    --nb-radius: 14px;
    --nb-bg: #f4f7fb;
    --nb-surface: #ffffff;
    --nb-surface-2: #eef4fd;
    --nb-surface-3: #f8fafc;
    --nb-text: #12213c;
    --nb-muted: #64748b;
    --nb-line: #d8e3e0;
    --nb-success: #149a62;
    --nb-success-bg: #e9f8f1;
    --nb-warning: #bd6b0b;
    --nb-warning-bg: #fff5e6;
    --nb-danger: #d44747;
    --nb-danger-bg: #fff0f0;
    --nb-shadow: 0 22px 70px rgba(33, 56, 91, .17);
    --nb-accent-soft: rgba(47, 158, 127, .16);
    --nb-glow: 0 10px 30px rgba(47, 158, 127, .26);
    --nb-hairline: rgba(255, 255, 255, .85);
    color-scheme: light dark;
    width: 100%;
  }
  #bfg-ui-prototype[data-dark="true"] {
    /* Deep, cool blacks with a faint blue cast. Surfaces step up in even
       increments so card edges read without needing heavy borders. */
    --nb-bg: #08090B;
    --nb-surface: #0F1215;
    --nb-surface-2: #161A1E;
    --nb-surface-3: #090f1a;
    --nb-text: #EDEFF2;
    --nb-muted: #98A1AC;
    --nb-line: rgba(255,255,255,.075);
    --nb-accent: #4FD1AE;
    --nb-accent-soft: rgba(79, 209, 174, .14);
    --nb-success: #34d399;
    --nb-success-bg: #0d2a22;
    --nb-warning: #fbbf5b;
    --nb-warning-bg: #2e2312;
    --nb-danger: #f87171;
    --nb-danger-bg: #2e1618;
    --nb-shadow: 0 24px 70px rgba(0, 0, 0, .55);
    /* Ring + halo used by primary actions and the SOC gauge. */
    --nb-glow: 0 10px 30px rgba(79, 209, 174, .24);
    --nb-hairline: rgba(255, 255, 255, .06);
  }
  #bfg-ui-prototype * { box-sizing: border-box; }
  #bfg-ui-prototype .nb-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: 100%;
  }
  #bfg-ui-prototype .nb-preview-nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }
  #bfg-ui-prototype .nb-preview-nav button {
    min-height: 36px;
    padding: 7px 13px;
    border: 1px solid var(--nb-line);
    border-radius: 999px;
    background: var(--nb-surface);
    color: var(--nb-muted);
    font: inherit;
  }
  #bfg-ui-prototype .nb-preview-nav button.is-active {
    background: var(--nb-text);
    border-color: var(--nb-text);
    color: var(--nb-bg);
  }
  #bfg-ui-prototype .nb-phone {
    width: min(100%, 430px);
    min-height: 790px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border-radius: 18px;
    background: var(--nb-bg);
    color: var(--nb-text);
    box-shadow: var(--nb-shadow);
    border: 1px solid var(--nb-line);
    font-family: Inter, "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  #bfg-ui-prototype .nb-statusbar {
    height: 38px;
    flex: 0 0 38px;
    display: flex;
    align-items: end;
    justify-content: space-between;
    padding: 0 22px 7px;
    background: var(--nb-bg);
    font-size: 13px;
    font-weight: 500;
  }
  #bfg-ui-prototype .nb-status-icons { display: inline-flex; gap: 5px; align-items: center; }
  #bfg-ui-prototype .nb-status-icons svg { width: 15px; height: 15px; }
  #bfg-ui-prototype .nb-screen { flex: 1; display: flex; min-height: 752px; }
  #bfg-ui-prototype .nb-page { width: 100%; min-height: 752px; display: flex; flex-direction: column; }
  #bfg-ui-prototype .nb-header {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 66px;
    /* Top inset keeps the title clear of the notch / Dynamic Island.
       Without viewport-fit=cover in the viewport meta this resolves to 0. */
    padding: max(12px, env(safe-area-inset-top, 0px)) 18px 12px;
    background: var(--nb-bg);
  }
  #bfg-ui-prototype .nb-header-copy { min-width: 0; flex: 1; }
  #bfg-ui-prototype .nb-title { margin: 0; font-size: 22px; line-height: 1.2; font-weight: 500; letter-spacing: -.02em; }
  #bfg-ui-prototype .nb-subtitle { margin: 4px 0 0; color: var(--nb-muted); font-size: 13px; line-height: 1.35; }
  #bfg-ui-prototype .nb-icon-btn {
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    flex: 0 0 42px;
    border: 0;
    border-radius: 14px;
    background: var(--nb-surface-2);
    color: var(--nb-text);
  }
  #bfg-ui-prototype .nb-icon-btn svg { width: 20px; height: 20px; }
  #bfg-ui-prototype .nb-settings-btn { width: auto; min-width: 70px; flex-basis: auto; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 8px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  #bfg-ui-prototype .nb-content { flex: 1; padding: 8px 18px 20px; }
  #bfg-ui-prototype .nb-section { margin-top: 18px; }
  #bfg-ui-prototype .nb-section:first-child { margin-top: 0; }
  #bfg-ui-prototype .nb-section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 2px 10px; }
  #bfg-ui-prototype .nb-section-title { margin: 0; font-size: 16px; font-weight: 500; }
  #bfg-ui-prototype .nb-section-note { margin: 0; font-size: 12px; color: var(--nb-muted); }
  #bfg-ui-prototype .nb-card {
    border-radius: var(--nb-radius);
    background: var(--nb-surface);
    border: 1px solid var(--nb-line);
    padding: 16px;
  }
  #bfg-ui-prototype .nb-vehicle-card { display: flex; align-items: center; gap: 13px; }
  #bfg-ui-prototype .nb-vehicle-icon {
    width: 48px; height: 48px; flex: 0 0 48px; display: grid; place-items: center;
    border-radius: 16px; background: var(--nb-surface-2); color: var(--nb-accent);
  }
  #bfg-ui-prototype .nb-vehicle-icon svg { width: 23px; height: 23px; }
  #bfg-ui-prototype .nb-grow { flex: 1; min-width: 0; }
  #bfg-ui-prototype .nb-label { color: var(--nb-muted); font-size: 12px; line-height: 1.4; }
  #bfg-ui-prototype .nb-value { margin-top: 3px; font-size: 17px; line-height: 1.3; font-weight: 500; }
  #bfg-ui-prototype .nb-badge {
    display: inline-flex; align-items: center; gap: 5px; padding: 6px 9px; border-radius: 999px;
    font-size: 12px; color: var(--nb-success); background: var(--nb-success-bg);
  }
  #bfg-ui-prototype .nb-badge svg { width: 14px; height: 14px; }
  #bfg-ui-prototype .nb-action-stack { display: grid; gap: 12px; }
  #bfg-ui-prototype .nb-action {
    min-height: 94px; width: 100%; display: flex; align-items: center; gap: 14px; text-align: left;
    padding: 16px; border-radius: var(--nb-radius); border: 1px solid var(--nb-line);
    background: var(--nb-surface); color: var(--nb-text); font: inherit;
  }
  #bfg-ui-prototype .nb-action.is-primary { background: var(--nb-accent); color: #06110E; border-color: transparent; }
  #bfg-ui-prototype .nb-action-icon {
    width: 46px; height: 46px; flex: 0 0 46px; display: grid; place-items: center;
    border-radius: 15px; background: rgba(79, 209, 174, .13);
  }
  #bfg-ui-prototype .nb-action-icon svg { width: 23px; height: 23px; }
  #bfg-ui-prototype .nb-action-copy { flex: 1; }
  #bfg-ui-prototype .nb-action-title { display: block; font-size: 17px; font-weight: 500; }
  #bfg-ui-prototype .nb-action-desc { display: block; margin-top: 4px; color: inherit; opacity: .76; font-size: 12px; line-height: 1.45; }
  #bfg-ui-prototype .nb-action > svg { width: 18px; height: 18px; flex: 0 0 18px; }
  #bfg-ui-prototype .nb-tip {
    display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; padding: 12px 13px;
    border-radius: 16px; background: var(--nb-surface-2); color: var(--nb-muted); font-size: 12px; line-height: 1.5;
  }
  #bfg-ui-prototype .nb-tip svg { width: 17px; height: 17px; flex: 0 0 17px; margin-top: 1px; }
  #bfg-ui-prototype .nb-bottom-nav {
    min-height: 66px; display: grid; grid-template-columns: repeat(3, 1fr);
    /* Bottom inset keeps the tab bar clear of the home indicator. */
    padding: 7px 14px max(10px, env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--nb-line); background: var(--nb-surface);
  }
  #bfg-ui-prototype .nb-bottom-nav button {
    border: 0; background: transparent; color: var(--nb-muted); display: grid; place-items: center;
    align-content: center; gap: 3px; font: inherit; font-size: 11px;
  }
  #bfg-ui-prototype .nb-bottom-nav button.is-active { color: var(--nb-accent); }
  #bfg-ui-prototype .nb-bottom-nav svg { width: 20px; height: 20px; }
  #bfg-ui-prototype .nb-list { display: grid; gap: 10px; }
  #bfg-ui-prototype .nb-list-item {
    width: 100%; display: flex; align-items: center; gap: 12px; padding: 15px; text-align: left;
    border: 1px solid var(--nb-line); border-radius: 18px; background: var(--nb-surface); color: var(--nb-text); font: inherit;
  }
  #bfg-ui-prototype .nb-list-item > svg { width: 18px; height: 18px; color: var(--nb-muted); }
  #bfg-ui-prototype .nb-primary, #bfg-ui-prototype .nb-secondary, #bfg-ui-prototype .nb-danger-btn {
    min-height: 52px; width: 100%; border-radius: 17px; padding: 13px 16px; font: inherit; font-weight: 500;
  }
  #bfg-ui-prototype .nb-primary {
    border: 0; color: #06110E;
    background-image: linear-gradient(180deg, rgba(255, 255, 255, .18), rgba(255, 255, 255, 0) 58%);
    background-color: var(--nb-accent);
    box-shadow: var(--nb-glow);
  }
  /* A disabled action is not an invitation: drop the glow entirely. */
  #bfg-ui-prototype .nb-primary:disabled {
    background-image: none; background-color: var(--nb-surface-2);
    color: var(--nb-muted); box-shadow: none; cursor: not-allowed;
  }

  /* Hero metrics: a SOC ring carrying the one number that matters, with the
     supporting values stacked beside it. */
  #bfg-ui-prototype .nb-hero-metrics {
    display: grid; grid-template-columns: 92px 1fr; gap: 14px; align-items: center;
  }
  #bfg-ui-prototype .nb-ring { position: relative; width: 92px; height: 92px; display: grid; place-items: center; }
  #bfg-ui-prototype .nb-ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  #bfg-ui-prototype .nb-ring-track { fill: none; stroke: var(--nb-line); stroke-width: 7; }
  #bfg-ui-prototype .nb-ring-fill {
    fill: none; stroke: var(--nb-accent); stroke-width: 7; stroke-linecap: round;
    filter: drop-shadow(0 0 7px var(--nb-accent-soft));
  }
  #bfg-ui-prototype .nb-ring.is-unknown .nb-ring-fill { stroke: var(--nb-muted); filter: none; }
  #bfg-ui-prototype .nb-ring-text { position: relative; text-align: center; }
  #bfg-ui-prototype .nb-ring-text strong { display: block; font-size: 21px; font-weight: 600; letter-spacing: -.02em; }
  #bfg-ui-prototype .nb-ring-text span { display: block; font-size: 11px; color: var(--nb-muted); margin-top: 1px; }
  #bfg-ui-prototype .nb-metric-stack { display: grid; gap: 9px; }
  #bfg-ui-prototype .nb-metric-sm {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 11px 13px; border-radius: 14px;
    background: var(--nb-surface-3); border: 1px solid var(--nb-line);
  }
  #bfg-ui-prototype .nb-metric-sm .nb-label { min-height: 0; margin: 0; text-align: left; }
  #bfg-ui-prototype .nb-metric-sm .nb-value { font-size: 16px; text-align: right; }
  #bfg-ui-prototype .nb-secondary { border: 1px solid var(--nb-line); background: var(--nb-surface); color: var(--nb-text); }
  #bfg-ui-prototype .nb-danger-btn { border: 0; background: var(--nb-danger); color: #fff; }
  #bfg-ui-prototype .nb-btn-row { display: grid; grid-template-columns: 1fr 1.35fr; gap: 10px; margin-top: 14px; }
  #bfg-ui-prototype .nb-inline-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 13px; }
  #bfg-ui-prototype .nb-inline-actions .nb-primary,
  #bfg-ui-prototype .nb-inline-actions .nb-secondary { min-height: 46px; padding: 10px 11px; font-size: 13px; }
  #bfg-ui-prototype .nb-hero-check {
    width: 70px; height: 70px; margin: 12px auto 18px; display: grid; place-items: center;
    border-radius: 50%; background: var(--nb-success-bg); color: var(--nb-success);
  }
  #bfg-ui-prototype .nb-hero-check svg { width: 34px; height: 34px; }
  #bfg-ui-prototype .nb-center { text-align: center; }
  #bfg-ui-prototype .nb-center p { margin: 7px 0 0; color: var(--nb-muted); font-size: 13px; line-height: 1.5; }
  #bfg-ui-prototype .nb-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  #bfg-ui-prototype .nb-metric {
    padding: 14px 10px; border-radius: 18px; background: var(--nb-surface-3); text-align: center;
    border: 1px solid var(--nb-line);
    /* Hairline along the top edge fakes a light source without a real gradient. */
    box-shadow: inset 0 1px 0 var(--nb-hairline);
  }
  #bfg-ui-prototype .nb-metric .nb-label { min-height: 34px; }
  #bfg-ui-prototype .nb-metric .nb-value { font-size: 19px; }
  #bfg-ui-prototype .nb-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; overflow: hidden; padding: 0; }
  #bfg-ui-prototype .nb-compare-col { padding: 15px; background: var(--nb-surface); }
  #bfg-ui-prototype .nb-compare-col + .nb-compare-col { border-left: 1px solid var(--nb-line); }
  #bfg-ui-prototype .nb-compare-row { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 13px; }
  #bfg-ui-prototype .nb-compare-row span:first-child { color: var(--nb-muted); }
  #bfg-ui-prototype .nb-info-list { display: grid; gap: 0; }
  #bfg-ui-prototype .nb-info-row { display: flex; justify-content: space-between; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--nb-line); font-size: 13px; }
  #bfg-ui-prototype .nb-info-row:last-child { border-bottom: 0; }
  #bfg-ui-prototype .nb-info-row span:first-child { color: var(--nb-muted); }
  #bfg-ui-prototype .nb-alert { display: flex; gap: 11px; align-items: flex-start; padding: 13px; border-radius: 17px; font-size: 13px; line-height: 1.5; }
  #bfg-ui-prototype .nb-alert svg { width: 18px; height: 18px; flex: 0 0 18px; margin-top: 1px; }
  #bfg-ui-prototype .nb-alert.success { color: var(--nb-success); background: var(--nb-success-bg); }
  #bfg-ui-prototype .nb-alert.warning { color: var(--nb-warning); background: var(--nb-warning-bg); }
  #bfg-ui-prototype .nb-alert.danger { color: var(--nb-danger); background: var(--nb-danger-bg); }
  #bfg-ui-prototype .nb-mode-list { display: grid; gap: 11px; }
  #bfg-ui-prototype .nb-mode {
    display: flex; gap: 13px; width: 100%; padding: 15px; text-align: left; border-radius: 19px;
    border: 1px solid var(--nb-line); background: var(--nb-surface); color: var(--nb-text); font: inherit;
  }
  #bfg-ui-prototype .nb-mode.is-selected { border-color: var(--nb-accent); background: var(--nb-surface-2); }
  #bfg-ui-prototype .nb-mode-dot {
    width: 22px; height: 22px; flex: 0 0 22px; border: 2px solid var(--nb-line); border-radius: 50%; margin-top: 1px;
  }
  #bfg-ui-prototype .nb-mode.is-selected .nb-mode-dot { border: 7px solid var(--nb-accent); }
  #bfg-ui-prototype .nb-mode-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 500; }
  #bfg-ui-prototype .nb-mode-desc { margin-top: 5px; color: var(--nb-muted); font-size: 12px; line-height: 1.5; }
  #bfg-ui-prototype .nb-lifetime { font-size: 11px; padding: 4px 7px; border-radius: 999px; color: var(--nb-success); background: var(--nb-success-bg); white-space: nowrap; }
  #bfg-ui-prototype .nb-temporary { font-size: 11px; padding: 4px 7px; border-radius: 999px; color: var(--nb-warning); background: var(--nb-warning-bg); white-space: nowrap; }
  #bfg-ui-prototype .nb-voltages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  #bfg-ui-prototype .nb-capacities { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  #bfg-ui-prototype .nb-capacity {
    min-height: 46px; border: 1px solid var(--nb-line); border-radius: 14px; background: var(--nb-surface); color: var(--nb-text); font: inherit;
  }
  #bfg-ui-prototype .nb-voltage {
    min-height: 52px; border: 1px solid var(--nb-line); border-radius: 15px; background: var(--nb-surface); color: var(--nb-text); font: inherit; font-weight: 500;
  }
  #bfg-ui-prototype .nb-voltage.is-selected,
  #bfg-ui-prototype .nb-capacity.is-selected { color: #fff; background: var(--nb-accent); border-color: var(--nb-accent); }
  #bfg-ui-prototype .nb-summary { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  #bfg-ui-prototype .nb-summary strong { font-size: 18px; }
  #bfg-ui-prototype .nb-chevron { color: var(--nb-accent); }
  #bfg-ui-prototype .nb-progress-ring {
    width: 70px; height: 70px; margin: 34px auto 20px; border-radius: 50%;
    border: 6px solid var(--nb-line); border-top-color: var(--nb-accent); animation: nb-spin .9s linear infinite;
  }
  #bfg-ui-prototype .nb-modal-layer {
    position: absolute; inset: 0; display: flex; align-items: flex-end; padding: 16px; z-index: 4;
    background: rgba(4, 10, 20, .55); border-radius: 18px;
  }
  #bfg-ui-prototype .nb-modal {
    width: 100%; padding: 20px; border-radius: 18px; background: var(--nb-surface); color: var(--nb-text);
    box-shadow: 0 16px 60px rgba(0,0,0,.28); max-height: calc(100dvh - 32px);
    overflow-y: auto; overscroll-behavior: contain; box-sizing: border-box;
  }
  #bfg-ui-prototype .nb-modal-icon { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 15px; background: var(--nb-warning-bg); color: var(--nb-warning); }
  #bfg-ui-prototype .nb-modal h3 { margin: 15px 0 7px; font-size: 20px; font-weight: 500; }
  #bfg-ui-prototype .nb-modal p { margin: 0; color: var(--nb-muted); font-size: 13px; line-height: 1.55; }
  #bfg-ui-prototype .nb-modal .nb-card { margin-top: 14px; background: var(--nb-surface-3); }
  #bfg-ui-prototype .nb-fw-list { margin-top: 16px; border: 1px solid var(--nb-line); border-radius: 16px; overflow: hidden; }
  #bfg-ui-prototype .nb-fw-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 12px; font-size: 12px; }
  #bfg-ui-prototype .nb-fw-row + .nb-fw-row { border-top: 1px solid var(--nb-line); }
  #bfg-ui-prototype .nb-fw-row span { color: var(--nb-muted); }
  #bfg-ui-prototype .nb-fw-row strong { color: var(--nb-text); font-weight: 600; }
  #bfg-ui-prototype .nb-fw-row em { color: var(--nb-danger); font-style: normal; font-weight: 600; }
  #bfg-ui-prototype .nb-fw-row em.is-match { color: var(--nb-success); }
  #bfg-ui-prototype .nb-page-wrap { position: relative; width: 100%; }
  @keyframes nb-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #bfg-ui-prototype .nb-progress-ring { animation: none; } }
  @media (max-width: 370px) {
    #bfg-ui-prototype .nb-phone { border-radius: 18px; }
    #bfg-ui-prototype .nb-content { padding-left: 14px; padding-right: 14px; }
    #bfg-ui-prototype .nb-grid-3 { gap: 6px; }
    #bfg-ui-prototype .nb-metric { padding-left: 6px; padding-right: 6px; }
    #bfg-ui-prototype .nb-capacities { grid-template-columns: repeat(3, 1fr); }
    #bfg-ui-prototype .nb-modal-layer { border-radius: 18px; }
  }
  html, body { margin: 0; min-height: 100%; background: #f4f7fb;
    /* iOS inflates text on its own unless this is pinned; the page sets its
       own scale deliberately. */
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  /* The prototype root paints its own background, but the page around it has
     to match, otherwise a light band shows wherever a screen is shorter than
     the viewport. */
  html:has(#bfg-ui-prototype[data-dark="true"]),
  body:has(#bfg-ui-prototype[data-dark="true"]) { background: #05090f; }
  #bfg-ui-prototype { color-scheme: light; }
  #bfg-ui-prototype[data-dark="true"] { color-scheme: dark; }
  #bfg-ui-prototype .nb-stage { display: block; }
  #bfg-ui-prototype .nb-preview-nav, #bfg-ui-prototype .nb-statusbar { display: none; }

/* ─────────────────────────────────────────────────────────────
   动效层：触摸反馈 / 错峰进场 / 页面切换 / 状态过渡
   只动 transform 与 opacity，不触发 layout；全部走自定义缓动。
   ───────────────────────────────────────────────────────────── */
:root{
  --nb-ease: cubic-bezier(.32,.72,0,1);
  --nb-ease-out: cubic-bezier(.22,1,.36,1);
}
/* 触摸反馈：按下时轻微收缩，模拟物理按压 */
.nb-action, .nb-primary, .nb-secondary, .nb-icon-btn, .nb-settings-btn,
.nb-tab, .nb-pill, [data-action]{
  -webkit-tap-highlight-color: transparent;
  transition: transform .16s var(--nb-ease-out),
              background-color .22s var(--nb-ease-out),
              border-color .22s var(--nb-ease-out),
              box-shadow .22s var(--nb-ease-out),
              color .22s var(--nb-ease-out);
}
.nb-action:active, .nb-primary:active, .nb-secondary:active,
.nb-icon-btn:active, .nb-settings-btn:active, .nb-tab:active{
  transform: scale(.977);
}
/* 区块进场：同屏元素按 40ms 错峰，避免整屏一起弹出来 */
@keyframes nb-rise{ from{ opacity:0; transform:translateY(10px) } to{ opacity:1; transform:none } }
.nb-content > *{ animation: nb-rise .46s var(--nb-ease) backwards; }
.nb-content > *:nth-child(1){ animation-delay: 20ms }
.nb-content > *:nth-child(2){ animation-delay: 60ms }
.nb-content > *:nth-child(3){ animation-delay: 100ms }
.nb-content > *:nth-child(4){ animation-delay: 140ms }
.nb-content > *:nth-child(5){ animation-delay: 180ms }
.nb-content > *:nth-child(n+6){ animation-delay: 220ms }
/* 页面切换：每次渲染都是新节点，动画会自动重放 */
@keyframes nb-page-in{ from{ opacity:0; transform:translateY(7px) } to{ opacity:1; transform:none } }
.nb-page{ animation: nb-page-in .40s var(--nb-ease) }
/* 状态徽标：连接中 → 已连接 之类的状态切换要有过渡，不能瞬间跳 */
.nb-badge{ transition: color .3s var(--nb-ease-out), background-color .3s var(--nb-ease-out) }
/* 进度：数值变化时平滑推进 */
.nb-progress i, .nb-bar i{
  transition: transform .45s var(--nb-ease)
}
/* 列表项：逐条进入，长列表也不会一次糊上来 */
@keyframes nb-row-in{ from{ opacity:0; transform:translateY(6px) } to{ opacity:1; transform:none } }
.nb-info-row{ animation: nb-row-in .40s var(--nb-ease) backwards }
.nb-info-row:nth-child(1){ animation-delay: 30ms }
.nb-info-row:nth-child(2){ animation-delay: 70ms }
.nb-info-row:nth-child(3){ animation-delay: 110ms }
.nb-info-row:nth-child(4){ animation-delay: 150ms }
.nb-info-row:nth-child(n+5){ animation-delay: 190ms }
/* 弹层 / 提示 */
@keyframes nb-pop{ from{ opacity:0; transform:scale(.96) translateY(6px) } to{ opacity:1; transform:none } }
.nb-modal-card, .nb-sheet, .nb-pop{ animation: nb-pop .34s var(--nb-ease) }
/* 加载态：保留原有转圈，补一层淡入 */
@keyframes nb-fade{ from{ opacity:0 } to{ opacity:1 } }
.nb-loading, .nb-spinner{ animation: nb-fade .3s var(--nb-ease), nb-spin .9s linear infinite }
/* 减弱动态：去掉位移，保留透明度反馈（不是全部关掉） */
@media (prefers-reduced-motion: reduce){
  .nb-content > *, .nb-page, .nb-info-row, .nb-modal-card, .nb-sheet, .nb-pop{
    animation-duration: .01ms !important; animation-delay: 0ms !important
  }
  .nb-action:active, .nb-primary:active, .nb-secondary:active{ transform:none }
}

/* ─────────────────────────────────────────────────────────────
   版型对齐主站：数值走等宽 + 表格数字，层级靠 hairline 与灰度，
   不靠加粗和放大。卡片描边压到 hairline 级别。
   ───────────────────────────────────────────────────────────── */
.nb-value, .nb-metric, .nb-reading, .nb-chip, .nb-badge,
.nb-info-row > span:last-child, .nb-kv > *{
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}
/* 关键读数：等宽 + 负字距，像仪器面板 */
.nb-reading, .nb-metric-value{
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  letter-spacing: -.02em;
}
/* 卡片描边统一压到 hairline，阴影收掉，靠表面色阶分层 */
.nb-card, .nb-action, .nb-section.nb-card, .nb-vehicle-card{
  border-color: var(--nb-hairline);
  box-shadow: none;
}
/* 分隔线用 hairline，替代一段一段的方框 */
.nb-info-row + .nb-info-row{ border-top: 1px solid var(--nb-hairline) }
/* 区块标题：小号 + 大字距，像标签而不是标题 */
.nb-section-title{
  font-size: 12.5px;
  letter-spacing: .06em;
  font-weight: 500;
  color: var(--nb-muted);
  text-transform: none;
}
/* 主按钮：更紧的圆角与更实的色，去掉上方的白色高光渐变 */
.nb-action.is-primary{
  background-image: none;
  box-shadow: 0 8px 24px rgba(79,209,174,.18);
}

    scanModule: '', scanReplies: 0, scanTimeouts: 0,

  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;

  // SOC ring. Falls back to an empty track when the value is unknown so the
  // layout does not jump between "--" and a real reading.
  function socRing(raw) {
    const digits = String(raw ?? '').replace(/[^\d.]/g, '');
    const value = Number(digits);
    const known = digits !== '' && Number.isFinite(value) && value >= 0 && value <= 100;
    const pct = known ? Math.max(0, Math.min(100, value)) : 0;
    const radius = 34;
    const circumference = 2 * Math.PI * radius;
    const filled = (pct / 100) * circumference;
    return `<div class="nb-ring${known ? '' : ' is-unknown'}">
      <svg viewBox="0 0 80 80" aria-hidden="true">
        <circle class="nb-ring-track" cx="40" cy="40" r="${radius}"></circle>
        <circle class="nb-ring-fill" cx="40" cy="40" r="${radius}"
          stroke-dasharray="${filled.toFixed(2)} ${(circumference - filled).toFixed(2)}"></circle>

        <section class="nb-card nb-section">

        </section>

        <section class="nb-card nb-section">
          <div class="nb-section-head"><h3 class="nb-section-title">额定容量寄存器 0x0E</h3></div>
          <p class="nb-label">计量模块算电量用的额定容量就存在这里。实测发现：只写档位（0x00）会在约 6.5 秒后被车辆改回，因为它与这里的值不自洽——所以要让改动站住，得连这个寄存器一起写。</p>
          <p class="nb-label">写入前会先读原值做备份，读不到就一个字节都不发；写后保持连接观察 90 秒，并在日志里记录 0x0E / 0x0F / 档位三个寄存器的变化。</p>

  function writeTemplate() {
    const isDash = state.writeType === 'dashboard';
    // The read-only-serial rule is a default the owner can waive, so it must not
    // disable the button — the tap is what opens the waiver. Every other blocker
    // still disables it, and the native side re-checks before any frame is sent.
    const serialWaivable = !!state.readOnlyVehicle && !isDash;
    const writeBlocked = isDash ? !state.dashboardWriteSupported : (!state.writeSupported && !serialWaivable);
    const blockedReason = state.readOnlyVehicle
      ? '此车序列号以 N 开头，原版规则仅允许读取。点「核对并写入」会让你确认后放开本次写入。'
      : isDash
      ? '仪表盘写入暂不可用。请查看版本要求与当前读取结果。'
      : '计量模块写入条件未确认，请重新读取车辆信息。';
    return `<div class="nb-page">
      ${header('参数写入', `${esc(maskedSn)} · 当前 ${esc(state.meterVoltage)} / ${esc(state.meterCapacity)}`, true)}
      <main class="nb-content">

  /// The risk gate. The countdown is only presentation: the native side holds
  /// the authoritative deadline and re-checks it when the confirmation arrives.
  function writeGateModal() {
    const gate = state.writeGate;
    if (!gate) return '';
    return `<div class="nb-modal-layer" role="dialog" aria-modal="true" aria-label="写入风险确认"><div class="nb-modal">
      <div class="nb-modal-icon">${icon('shield-alert')}</div>
      <h3>${esc(gate.title)}</h3>
      <p>${esc(gate.intro)}</p>
      <div class="nb-alert danger">${icon('triangle-alert')}<span>${esc(gate.critical)}</span></div>
      <label style="display:flex;gap:12px;align-items:flex-start;margin:16px 0;min-height:48px;font-size:15px;line-height:1.5;cursor:pointer">
        <input type="checkbox" id="write-gate-check" style="width:22px;height:22px;flex:0 0 22px;margin:2px 0 0">
        <span>${esc(gate.acknowledgement)}</span>
      </label>
      <div class="nb-btn-row"><button type="button" class="nb-secondary" data-action="write-gate-cancel">取消</button><button type="button" class="nb-primary" id="write-gate-confirm" disabled data-action="write-gate-confirm">${esc(gate.action)}</button></div>
    </div></div>`;
  }

  let gateTimer = null;
  let gateNonceSeen = null;
  let gateDeadline = 0;

  /// Re-armed after every render. The deadline is anchored to the gate's nonce so
  /// an unrelated repaint cannot restart the wait.
  function startGateTimer() {
    if (gateTimer) { clearInterval(gateTimer); gateTimer = null; }
    const gate = state.writeGate;
    if (!gate || state.modal !== 'write-gate') { gateNonceSeen = null; return; }
    if (gateNonceSeen !== gate.nonce) {
      gateNonceSeen = gate.nonce;
      gateDeadline = Date.now() + (Number(gate.seconds) || 0) * 1000;
    }
    const button = document.getElementById('write-gate-confirm');
    const box = document.getElementById('write-gate-check');
    const label = gate.action;
    const sync = () => {
      if (!button) return;
      const left = Math.max(0, Math.ceil((gateDeadline - Date.now()) / 1000));
      button.disabled = !(left === 0 && !!(box && box.checked));
      button.textContent = left > 0 ? `${label}（${left}秒）` : label;
    };
    if (box) box.onchange = sync;
    sync();
    gateTimer = setInterval(() => {
      sync();
      if (Date.now() >= gateDeadline && gateTimer) { clearInterval(gateTimer); gateTimer = null; }
    }, 250);
  }

  function statusModal() {
    const kind = state.modal;
    const specs = {
      'bluetooth-off': ['bluetooth', '蓝牙尚未开启', state.errorMessage || '请打开系统蓝牙后返回重试。', '打开蓝牙设置', 'open-bluetooth-settings', '稍后', 'close-modal'],
      'permission-needed': ['shield-alert', '需要蓝牙相关权限', state.errorMessage || '请允许位置和附近设备权限后重试。', '我知道了', 'close-modal', '', ''],
      'auth-repair': ['key-round', '车辆认证没有回应', state.errorMessage || '检查其他应用或手机是否占用车辆蓝牙，然后重试。', state.screen === 'pair-ready' ? '重新尝试配对' : '重试连接', state.screen === 'pair-ready' ? 'begin-pair' : 'retry-connect', '稍后', 'close-modal'],

      // reports back goes here verbatim, so a failed attempt is never a spinner

      'operation-failed': ['triangle-alert', '操作未完成', state.errorMessage || '请检查车辆电源与蓝牙后重试。', '我知道了', 'close-modal', '', ''],

      'write-failure': ['circle-x', '写入未完成', state.errorMessage || '请重新读取当前参数，再决定是否重试。', '再次尝试', 'retry-write', '取消', 'close-modal'],
      // Not a success under any wording: the target landed, but other registers
      // moved too. The primary action is the evidence-gathering one, not a retry.
      'write-collateral': ['triangle-alert', '写入波及超出预期', state.errorMessage || '检测到目标地址之外的寄存器变化。请导出寄存器快照，并在查明原因前停止继续写入。', '导出寄存器快照', 'dump-registers', '我知道了', 'close-modal'],
      'verification-incomplete': ['triangle-alert', '二次核对未完成', state.errorMessage || '先重新读取参数，确认前不要重复写入。', '重新核对', 'post-write-reread', '取消', 'close-modal'],
      'restore-unavailable': ['triangle-alert', '暂时无法恢复', state.errorMessage || '请先核对车辆与备份，再重新尝试。', '知道了', 'close-modal', '', ''],
      'dump-complete': ['file-text', '寄存器快照', state.errorMessage || '快照已导出到本应用文档目录，也可直接分享。', '我知道了', 'close-modal', '分享文件', 'share-dump'],
      'diagnostic-exported': ['circle-check', '诊断已导出', state.errorMessage || '文件已写入本应用的文档目录，也可直接分享。', '我知道了', 'close-modal', '分享文件', 'share-diagnostic'],
      'data-cleared': ['circle-check', '本机数据已清除', state.errorMessage || '配对凭据与备份已删除。', '我知道了', 'close-modal', '', ''],
      'clear-data-confirm': ['triangle-alert', '清除本机数据？', '将删除本机保存的配对凭据与参数备份。清除后需要重新配对才能使用，且无法找回备份。', '确认清除', 'clear-data-confirmed', '取消', 'close-modal'],
      'scan-unavailable': ['triangle-alert', '扫描未完成', state.errorMessage || '请检查车辆连接后再试。', '我知道了', 'close-modal', '', ''],
      'read-advisory': ['triangle-alert', '读取结果仅供参考', state.errorMessage || '请核对车辆实际配置。', '我知道了', 'close-modal', '', ''],
      'unverified-dis': ['triangle-alert', '仪表配置尚未验证', state.errorMessage || '这组仪表配置尚无实车验证，请确认可以恢复原参数后继续。', '仍要尝试写入', 'confirm-unverified-dis', '取消', 'close-modal'],
      'offtable-write': ['triangle-alert', '本车型的容量映射与静态表不同', state.errorMessage || '照表写入得不到你选的容量。', '我已知晓，仍要写入', 'confirm-offtable-write', '取消', 'close-modal'],
      'nserial-write': ['triangle-alert', '该车辆序列号以 N 开头', state.errorMessage || '原版工具把 N 开头的序列号一律视为只读。只有在你确认这是本人的车辆后才应继续。', '我确认，放开本次写入', 'confirm-nserial-write', '取消', 'close-modal']
    };

      <div class="nb-modal-icon">${icon(item[0])}</div><h3>${esc(item[1])}</h3><p>${esc(item[2])}</p>
      ${kind === 'auth-repair' && state.screen !== 'pair-ready' ? `<button type="button" class="nb-secondary" style="margin-top:12px" data-action="start-repair">重新配对（需车端确认）</button>` : ''}
      <div class="nb-btn-row"><button type="button" class="nb-primary" data-action="${item[4]}">${item[3]}</button>${item[5] ? `<button type="button" class="nb-secondary" data-action="${item[6]}">${item[5]}</button>` : ''}</div>

  function render() {
    root.style.setProperty('--nb-radius', `${state.radius}px`);
    root.style.setProperty('--nb-accent', state.accent);
    // Dark is the primary look. Light stays available but must be asked for
    // explicitly with state.dark === false.
    root.dataset.dark = state.dark === false ? 'false' : 'true';
    maskedSn = state.vehicleSn.length > 8
      ? `${state.vehicleSn.slice(0, 4)}••••${state.vehicleSn.slice(-5)}` : state.vehicleSn;
    root.querySelector('.nb-phone').style.fontSize = state.compact ? '14px' : '16px';
    let html;
    if (state.screen === 'vehicles') html = vehiclesTemplate();
    else if (state.screen === 'settings') html = settingsTemplate();
    else if (state.screen === 'pair-list') html = vehicleListTemplate();
    else if (state.screen === 'pair-ready') html = readyTemplate(true);
    else if (state.screen === 'connect-ready') html = readyTemplate(false);
    else if (state.screen === 'pair-progress') html = progressTemplate(true);
    else if (state.screen === 'connect-progress') html = progressTemplate(false);
    else if (state.screen === 'write-progress') html = writeProgressTemplate();
    else if (state.screen === 'post-write-check') html = postWriteCheckTemplate();
    else if (state.screen === 'scan-progress' || state.screen === 'scan-result') html = scanTemplate();
    else if (state.screen === 'review') html = reviewTemplate();
    else if (state.screen === 'write') html = writeTemplate();
    else html = homeTemplate();
    // 扫描进度、状态文案这类同页更新几秒就来一次；若每次都重放入场动画，
    // 整页会不停淡入上移，看起来就是「跳一下」。
    const visualKey = `${state.screen}|${state.modal || ''}`;
    const screenChanged = visualKey !== lastVisualKey;
    lastVisualKey = visualKey;
    screen.innerHTML = `<div class="nb-page-wrap">${html}${state.modal === 'wake' ? wakeModal() : state.modal === 'write-confirm' ? writeConfirmModal() : state.modal === 'write-gate' ? writeGateModal() : state.modal === 'dashboard-requirements' ? dashboardRequirementsModal() : state.modal === 'missing-vehicle' ? missingVehicleModal() : state.modal === 'license' ? licenseModal() : statusModal()}</div>`;
    if (!screenChanged) {
      // 同页更新：新节点上不要重放动画，让数值自己变就好
      screen.querySelectorAll('.nb-page, .nb-content > *, .nb-info-row')
            .forEach(function (el) { el.style.animation = 'none'; });
    }
    startGateTimer();
    const modalVisibility = state.modal ? 'open' : 'closed';
    if (modalVisibility !== lastModalVisibility) {
      lastModalVisibility = modalVisibility;
      nativeAction('modal-state', modalVisibility);
    }
    root.querySelectorAll('[data-preview]').forEach(btn => btn.classList.toggle('is-active', btn.dataset.preview === (state.result || state.screen)));
    if (globalThis.lucide) globalThis.lucide.createIcons({ attrs: { width: 16, height: 16 } });
  }

  function go(screenName) { state.screen = screenName; state.modal = null; render(); save(); nativeAction('screen', screenName); }
  function showWake(path) { state.path = path; state.modal = 'wake'; render(); save(); }
  function completeConnection(pairing) {
    state.result = null;
    state.errorMessage = '';
    state.busyMessage = '';
    go(pairing ? 'pair-progress' : 'connect-progress');
    if (window.BfgNative) nativeAction(pairing ? 'begin-pair' : 'begin-connect', pairing ? String(state.selectedPairIndex ?? '') : '');
    else window.setTimeout(() => { if (state.screen.endsWith('progress')) go('review'); }, 900);
  }
  function completeWrite(result) {
    state.result = result;
    go('review');
  }

  root.addEventListener('click', event => {
    const preview = event.target.closest('[data-preview]');
    if (preview) {
      const p = preview.dataset.preview;
      if (p === 'success' || p === 'failure') { state.result = p; go('review'); }
      else { state.result = null; go(p); }
      return;
    }
    const type = event.target.closest('[data-type]');
    if (type) { state.writeType = type.dataset.type; render(); save(); return; }
    const voltage = event.target.closest('[data-voltage]');
    if (voltage) {
      state.voltage = Number(voltage.dataset.voltage);
      const options = state.capacityByVoltage[String(state.voltage)] || state.availableCapacities;
      if (Array.isArray(options) && options.length) {
        state.availableCapacities = options;
        if (!options.includes(state.capacity)) state.capacity = options.find(v => v >= state.capacity) || options[options.length - 1];
      }
      render(); save(); return;
    }
    const cap = event.target.closest('[data-capacity]');
    if (cap) { state.capacity = Number(cap.dataset.capacity); render(); save(); return; }
    const actionEl = event.target.closest('[data-action]');
    if (!actionEl) return;
    const action = actionEl.dataset.action;
    if (action === 'home') { if (window.BfgNative) nativeAction('cancel'); state.result = null; go('home'); }
    else if (action === 'back') { if (state.screen === 'post-write-check') return; if (window.BfgNative && state.screen.endsWith('progress')) nativeAction('cancel'); go(state.screen === 'scan-result' || state.screen === 'scan-progress' ? 'settings' : (state.screen === 'write' || state.screen === 'write-progress') ? 'review' : 'home'); }
    else if (action === 'vehicles' || action === 'settings') { go(action); }
    else if (action === 'select-vehicle') { state.selectedVehicleIndex = Number(actionEl.dataset.index); if (window.BfgNative) nativeAction('select-vehicle', String(state.selectedVehicleIndex)); go('home'); }
    else if (action === 'refresh-vehicles') { if (window.BfgNative) nativeAction('refresh-vehicles'); }
    else if (action === 'clear-data') { state.modal = 'clear-data-confirm'; render(); save(); }
    else if (action === 'clear-data-confirmed') { state.modal = null; render(); save(); if (window.BfgNative) nativeAction('clear-data'); }
    else if (action === 'export-diag' || action === 'show-license'
             || action === 'restore-first' || action === 'restore-prewrite'
             || action === 'restore-dis' || action === 'compare-dump') { if (window.BfgNative) nativeAction(action); }
    else if (action === 'dump-registers') {
      // A full sweep runs each address twice, so it takes minutes. Staying on
      // the settings page for that long looks exactly like a dead button, so
      // borrow the scan progress screen — it already has the ring, the caption
      // and a cancel button that stops the client.
      state.scanModule = '寄存器快照'; state.scanReplies = 0; state.scanTimeouts = 0;
      go('scan-progress');
      if (window.BfgNative) nativeAction(action);
    }
    else if (action === 'scan-dis' || action === 'scan-bfg') { state.scanModule = action === 'scan-dis' ? '仪表盘' : '计量模块'; state.errorMessage = ''; state.scanReplies = 0; state.scanTimeouts = 0; go('scan-progress'); if (window.BfgNative) nativeAction(action); }
    else if (action === 'cancel-scan') { if (window.BfgNative) nativeAction('cancel'); go('settings'); }
    else if (action === 'show-dashboard-requirements') { state.modal = 'dashboard-requirements'; render(); }
    else if (action === 'pair-list') { go('pair-list'); if (window.BfgNative) nativeAction('pair-scan'); }
    else if (action === 'pair-select') { const index = Number(actionEl.dataset.index); state.selectedPairIndex = index; const vehicle = state.vehicles[index]; if (vehicle) state.vehicleSn = vehicle.sn; if (window.BfgNative) nativeAction('pair-select', String(index)); showWake('pair'); }
    else if (action === 'connect-start') { if (window.BfgNative && !state.vehicleSn) { state.modal = 'missing-vehicle'; render(); } else showWake('connect'); }
    else if (action === 'wake-confirm') go(state.path === 'pair' ? 'pair-ready' : 'connect-ready');
    else if (action === 'close-modal') { state.modal = null; render(); save(); }
    else if (action === 'open-bluetooth-settings') { state.modal = null; render(); if (window.BfgNative) nativeAction('open-bluetooth-settings'); }
    else if (action === 'retry-connect') { state.modal = null; completeConnection(false); }
    else if (action === 'start-repair') { state.modal = null; render(); if (window.BfgNative) nativeAction('start-repair'); else go('pair-list'); }
    else if (action === 'retry-write') {
      const target = JSON.stringify({type:state.writeType,voltage:state.voltage,capacity:state.capacity});
      state.modal = null; state.result = null; state.writeStage = 'precheck'; go('connect-progress');
      if (window.BfgNative) nativeAction('retry-write', target);
      else window.setTimeout(() => { go('write'); state.modal = 'write-confirm'; render(); }, 500);
    }
    else if (action === 'post-write-reread') { state.modal = null; go('post-write-check'); if (window.BfgNative) nativeAction('post-write-reread'); }
    else if (action === 'confirm-unverified-dis') { state.modal = null; state.writeStage = 'precheck'; go('write-progress'); if (window.BfgNative) nativeAction('confirm-unverified-dis'); }
    else if (action === 'confirm-nserial-write') { state.modal = null; state.writeStage = 'precheck'; go('write-progress'); if (window.BfgNative) nativeAction('confirm-nserial-write'); }
    else if (action === 'confirm-offtable-write') { state.modal = null; state.writeStage = 'precheck'; go('write-progress'); if (window.BfgNative) nativeAction('confirm-offtable-write'); }
    else if (action === 'write-gate-confirm') {
      const box = document.getElementById('write-gate-check');
      const confirmButton = document.getElementById('write-gate-confirm');
      if (confirmButton && confirmButton.disabled) return;
      if (window.BfgNative) nativeAction('write-gate-confirm', JSON.stringify({ nonce: state.writeGate ? state.writeGate.nonce : -1, checked: !!(box && box.checked) }));
    }
    else if (action === 'write-gate-cancel') { state.writeGate = null; state.modal = null; render(); save(); if (window.BfgNative) nativeAction('write-gate-cancel'); }
    else if (action === 'begin-pair') completeConnection(true);
    else if (action === 'begin-connect') completeConnection(false);
    else if (action === 'write') {
      // Seed the pickers from what the vehicle holds now. vehicleVoltage and
      // vehicleCapacity are deliberately separate keys from voltage/capacity,
      // which hold the rider's choice: sharing them meant every native status
      // push reset the choice mid-flow, so the confirmation screen showed the
      // value the rider picked and the progress screen showed something else.
      if (state.vehicleVoltage) {
        state.voltage = state.vehicleVoltage;
        const opts = state.capacityByVoltage[String(state.voltage)];
        if (Array.isArray(opts) && opts.length) state.availableCapacities = opts;
      }
      if (state.vehicleCapacity) state.capacity = state.vehicleCapacity;
      go('write');
    }
    else if (action === 'refresh-review') { state.result = null; go('connect-progress'); if (window.BfgNative) nativeAction('refresh-read'); }
    else if (action === 'confirm-write') {
      if (state.writeType === 'dashboard' && !state.dashboardWriteSupported) return;
      if (state.writeType === 'meter' && !state.writeSupported && !state.readOnlyVehicle) return;
      state.modal = 'write-confirm'; render(); save();
    }
    else if (action === 'do-write') {
      state.modal = null;
      state.result = null;
      state.errorMessage = '';
      state.writeStage = 'precheck';
      go('write-progress');
      if (window.BfgNative) nativeAction('do-write', JSON.stringify({type:state.writeType,voltage:state.voltage,capacity:state.capacity}));
      else window.setTimeout(() => completeWrite('success'), 900);
    }
    // Anything this chain does not handle itself still has to reach the native
    // side. Without a fallback, a button whose action is not listed above is
    // wired to nothing at all: tapping it does absolutely nothing — no error, no
    // navigation, no log line — which is exactly how the read-only-serial
    // confirmation shipped dead while its native handler sat there waiting.
    else { if (window.BfgNative) nativeAction(action); }
  });

  window.bfgNativeUpdate = function(json) {
    const update = typeof json === 'string' ? JSON.parse(json) : json;
    // Native clears a spent directive by removing it. A null must never reach
    // state.screen anyway: the render switch below has no null branch, so it
    // selects the home template, and every later push would then send the
    // rider home. Only a real screen name may move navigation.
    if (update.screen == null) delete update.screen;
    Object.assign(state, update);
    if (update.screen) { state.screen = update.screen; nativeAction('screen', update.screen); }
    // A gate arriving opens its modal; the native side clears it after the write.
    if (Object.prototype.hasOwnProperty.call(update, 'writeGate')) {
      state.modal = update.writeGate ? 'write-gate' : null;
    }
    if (update.result && !Object.prototype.hasOwnProperty.call(update, 'modal')) state.modal = null;
    render();
  };
  window.bfgNativeGo = function(screenName) { go(screenName); };

  render();
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root.querySelector('.nb-phone'), onChange: render });
    tweak.addSlider(state, 'radius', { label: '卡片圆角', min: 14, max: 30, unit: 'px', reference: '--nb-radius' });
    tweak.addColorPicker(state, 'accent', { label: '主色', reference: '--nb-accent' });
    tweak.addToggle(state, 'compact', { label: '紧凑排版', reference: 'layout.compact' });
  }
})();

  // 调试用：?screen=review 直接打开指定页面（bfgNativeGo 本就暴露给原生，这里只是给它一个 URL 入口）
  (function(){
    var m = location.search.match(/[?&]screen=([\w-]+)/);
    if(!m || !window.bfgNativeGo) return;
    addEventListener('load', function(){ setTimeout(function(){
      try { window.bfgNativeGo(m[1]); } catch(e) {}
    }, 80); });
  })();
</script>
</body></html>
