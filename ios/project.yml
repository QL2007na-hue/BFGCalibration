# XcodeGen spec.
#
# The .xcodeproj is generated rather than committed: a generated project is
# reviewable as a short YAML file instead of a multi-thousand-line pbxproj, and
# it cannot drift from what the sources actually contain.
#
# Regenerate with:
#   brew install xcodegen && xcodegen generate --spec ios/project.yml

name: BFGCalibration

options:
  bundleIdPrefix: com.bfgtools.calibration
  # iOS 16 is required by UIViewRepresentable.sizeThatFits(_:uiView:context:),
  # which takes a ProposedViewSize. That overload is what lets the web view be
  # sized to the window rather than to its own content.
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  BFGCore:
    path: ..

targets:
  BFGCalibration:
    type: application
    platform: iOS
    sources:
      - path: BFGCalibration
        excludes:
          - Info.plist
    resources:
      - path: BFGCalibration/Resources
    # The Info.plist is authored by hand and used as-is.
    #
    # It must NOT go through XcodeGen's `info:` key: that key makes XcodeGen
    # *generate* the plist at the given path, overwriting the file and dropping
    # every key not restated under `info.properties`. That silently removed
    # UILaunchScreen (which iOS needs to render full screen) and
    # NSBluetoothAlwaysUsageDescription (without which iOS terminates the app
    # the moment it touches CoreBluetooth).
    settings:
      base:
        INFOPLIST_FILE: BFGCalibration/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.bfgtools.calibration.imported
        PRODUCT_NAME: BFGCalibration
        MARKETING_VERSION: "2.1.5"
        CURRENT_PROJECT_VERSION: "6"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        # A BLE calibration tool has no business shipping for the simulator.
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        # Overridden by the CI workflow for unsigned builds.
        CODE_SIGNING_ALLOWED: YES
    dependencies:
      - package: BFGCore
        product: BFGCore
